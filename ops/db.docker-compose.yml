# FairShare production database (persistent). Backups: ./backups/ (fairshare-backup.timer).
name: fairshare-prod
services:
  db:
    image: postgres:17-alpine
    container_name: fairshare-prod-db
    env_file: db.env
    ports:
      - '127.0.0.1:55441:5432'
    volumes:
      - fairshare-prod-pg:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fairshare -d fairshare_prod']
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  fairshare-prod-pg:
