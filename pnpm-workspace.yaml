# Dependencies allowed to run install scripts (pnpm 10+ blocks them by default).
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@tailwindcss/oxide': true
  bcrypt: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - '@tailwindcss/oxide'
  - bcrypt
  - esbuild
  - prisma
  - sharp
  - unrs-resolver
# Security overrides for transitive deps (pnpm audit --prod must stay clean).
overrides:
  '@auth/core': '0.41.3'
  'postcss@<8.5.23': '^8.5.30'
  'nanoid@<3.3.18': '^3.3.20'
  'source-map-js@<1.2.2': '^1.2.2'
  'defu@<6.1.5': '^6.1.7'
  'effect@<3.20.0': '^3.22.2'
  'deepmerge-ts@<8.0.0': '^8.0.2'
  'sharp@<0.35.5': '0.35.5'
